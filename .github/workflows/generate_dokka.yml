name: Dokka Documentation Artifact

on:
workflow_dispatch:
push:
branches:
- master
- main
paths:
- '.kt'
- '.kts'
- '.java'
- '.xml'
- '.md'
- 'gradle/'
- 'gradlew'
- 'gradlew.bat'
- 'settings.gradle*'
- 'build.gradle*'
- '.github/workflows/dokka-docs.yml'

permissions:
contents: read

concurrency:
group: dokka-docs-${{ github.ref }}
cancel-in-progress: true

jobs:
generate-dokka:
name: Generate CloudStream Dokka HTML
runs-on: ubuntu-latest
timeout-minutes: 60

steps:
  - name: Checkout CloudStream
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Verify Gradle Wrapper
    run: |
      test -f gradlew || {
        echo "::error::Gradle wrapper not found"
        exit 1
      }
      chmod +x gradlew
      ./gradlew --version

  - name: Generate Dokka HTML
    run: |
      ./gradlew docs:dokkaGeneratePublicationHtml \
        --no-daemon \
        --stacktrace

  - name: Inspect Generated Documentation
    if: always()
    run: |
      echo "Searching for generated Dokka files..."
      find docs/build/dokka -maxdepth 6 -type f 2>/dev/null | head -200 || true

  - name: Upload Dokka HTML Artifact
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: cloudstream-dokka-html-${{ github.run_number }}
      path: docs/build/dokka/html/
      if-no-files-found: warn
      retention-days: 30
      compression-level: 6
